spring.application.name=cadence

# --- Database (Section 5, PostgreSQL assumed) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/cadence_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (Section 18.1, RBAC) ---
app.jwt.private-key-path=classpath:keys/private_key.pem
app.jwt.public-key-path=classpath:keys/public_key.pem
app.jwt.access-token-expiry-ms=${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}

# --- GitHub App (Section 7.1, CI/CD flow) ---
github.app.id=${GITHUB_APP_ID:}
github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:}
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}

# --- Attendance verification (Section 6) ---
attendance.geofence.default-radius-metres=30
attendance.override.target-percent=10
attendance.override.alert-threshold-percent=15
attendance.heartbeat.interval-minutes=7

# --- GPS retention (Section 9) ---
attendance.gps.retention-days=90

# --- Notification retention (Section 18.9) ---
notification.retention-days=180

# --- Logging (Section 11) ---
logging.level.root=INFO
logging.level.com.dayo.capstone.cadence=DEBUG
logging.level.org.hibernate.orm.queries=DEBUG

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Email ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast: a host that blocks SMTP ports otherwise hangs the connection.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Which transport sends email: log (default — nothing leaves the machine),
# smtp (uses MAIL_* above), brevo-api, resend-api or mailjet-api. See README "Email".
app.email.provider=${EMAIL_PROVIDER:log}
app.email.from-address=${EMAIL_FROM_ADDRESS:}
app.email.from-name=${EMAIL_FROM_NAME:Cadence}
app.email.api-key=${EMAIL_API_KEY:}
# Mailjet only: its API uses a key pair (API key + secret key).
app.email.api-secret=${EMAIL_API_SECRET:}
app.email.api-base-url=${EMAIL_API_BASE_URL:}
app.email.timeout-ms=${EMAIL_TIMEOUT_MS:5000}
# Free tiers cap daily sends; notification emails stop at the cap (in-app continues).
app.email.daily-cap=${EMAIL_DAILY_CAP:280}

# --- Notifications ---
# Types that also go out by email (comma-separated); everything else is in-app only.
app.notifications.email-types=${NOTIFICATION_EMAIL_TYPES:ATTENDANCE_OVERRIDDEN}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# --- Cloudinary ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.seed.super-admin.email=${SUPER_ADMIN_EMAIL}
app.seed.super-admin.password=${SUPER_ADMIN_PASSWORD}
app.seed.institution.name=Semicolon Africa
app.seed.platform-admin.email=${PLATFORM_ADMIN_EMAIL:}
app.seed.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:}

app.webauthn.rp-id=localhost
app.webauthn.rp-name=Cadence
app.webauthn.origin=http://localhost:3000