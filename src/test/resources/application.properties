# Test configuration. This file REPLACES src/main/resources/application.properties
# on the test classpath, so every key the app reads must be here.
# Database: in-memory H2 in PostgreSQL mode, schema built from the entities.
# JWT keys: generated per test run (see TestKeys / IntegrationTestBase) — never committed.
spring.application.name=cadence-test
spring.datasource.url=jdbc:h2:mem:cadence;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

github.app.id=
github.app.private-key-path=
github.webhook.secret=test

attendance.geofence.default-radius-metres=30
attendance.override.target-percent=10
attendance.override.alert-threshold-percent=15
attendance.heartbeat.interval-minutes=7
attendance.gps.retention-days=90
notification.retention-days=180

logging.level.root=WARN
logging.level.com.dayo.capstone.cadence=INFO

# Mail is never really sent: an unreachable host makes EmailService log and move on.
spring.mail.host=localhost
spring.mail.port=1
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.connectiontimeout=200
spring.mail.properties.mail.smtp.timeout=200

app.frontend-url=http://localhost:3000
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.seed.super-admin.email=seed-admin@test.cadence
app.seed.super-admin.password=Seed-Password-1!
app.seed.institution.name=Seed Institution
app.seed.platform-admin.email=Platform-Seed@Test.Cadence
app.seed.platform-admin.password=Platform-Seed-1!
app.webauthn.rp-id=localhost
app.webauthn.rp-name=Cadence
app.webauthn.origin=http://localhost:3000

# Email: the log provider, no retries waiting in tests.
app.email.provider=log
app.email.retry-backoff-ms=10
