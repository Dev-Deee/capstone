# main is the deploy branch: every push to it (a merged develop → main PR)
# runs the tests again and, only if they pass, deploys the API to Railway.
# Railway builds the Dockerfile in this repo.
#
# Needs these repository secrets / variables (Settings → Secrets and variables → Actions):
#   secret   RAILWAY_TOKEN    a Railway *project* token for the production environment
#   variable RAILWAY_SERVICE  the Railway service name (e.g. cadence-api)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Railway is configured
        id: check
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo "::warning::RAILWAY_TOKEN / RAILWAY_SERVICE not set — tests passed but nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Railway
        if: steps.check.outputs.ready == 'true'
        run: |
          npm install -g @railway/cli
          railway up --ci --service "$RAILWAY_SERVICE"
