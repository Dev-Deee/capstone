# Build and test on every push to develop or a feature branch, and on every
# pull request into develop or main. main is deploy-only (see deploy.yml).
name: CI

on:
  push:
    branches: [develop, "feature/**", "ci/**", "fix/**"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
      - name: Docker image builds
        run: docker build -t cadence-api:ci .
